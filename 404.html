<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Page Not Found — Md. Abid Hossain</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    :root{--primary:#16a34a;--green-50:#f0fdf4;--green-200:#bbf7d0;--green-400:#4ade80;--gray-400:#9ca3af;--gray-600:#4b5563;--gray-900:#111827}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Plus Jakarta Sans',sans-serif;background:linear-gradient(160deg,#fff 0%,#f0fdf4 50%,#fff 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
    .wrap{max-width:560px}
    .code{font-family:'Syne',sans-serif;font-size:clamp(6rem,18vw,10rem);font-weight:800;line-height:1;background:linear-gradient(135deg,#16a34a,#4ade80);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
    h1{font-family:'Syne',sans-serif;font-size:clamp(1.4rem,3vw,2rem);font-weight:800;color:var(--gray-900);margin-bottom:12px}
    p{font-size:1rem;color:var(--gray-600);line-height:1.7;margin-bottom:36px}
    .btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
    .btn-home{display:inline-flex;align-items:center;gap:8px;padding:14px 28px;border-radius:9999px;background:linear-gradient(135deg,#16a34a,#22c55e);color:white;font-weight:700;font-size:15px;text-decoration:none;box-shadow:0 8px 32px rgba(22,163,74,.25);transition:transform .25s,box-shadow .25s}
    .btn-home:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(22,163,74,.35)}
    .btn-back{display:inline-flex;align-items:center;gap:8px;padding:13px 27px;border-radius:9999px;border:2px solid #4ade80;color:#16a34a;font-weight:700;font-size:15px;text-decoration:none;transition:all .25s}
    .btn-back:hover{background:#f0fdf4;transform:translateY(-2px)}
    .icon{font-size:4rem;margin-bottom:24px}
  </style>
  <script>
    // GitHub Pages SPA redirect
    (function(){
      var l = window.location;
      if(l.search[1] === '/'){
        var decoded = l.search.slice(1).split('&').map(function(s){return s.replace(/~and~/g,'&')}).join('?');
        window.history.replaceState(null,null,l.pathname.slice(0,-1)+decoded+l.hash);
      }
    })();
  </script>
</head>
<body>
  <div class="wrap">
    <div class="icon">🔍</div>
    <div class="code">404</div>
    <h1>Page Not Found</h1>
    <p>Oops! The page you're looking for doesn't exist or has been moved. Let's get you back on track.</p>
    <div class="btns">
      <a href="/" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Go Home
      </a>
      <a href="javascript:history.back()" class="btn-back">← Go Back</a>
    </div>
  </div>
</body>
</html>
